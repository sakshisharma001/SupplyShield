name: SupplyShield Continuous Integration & Security Assurance

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-audit:
    name: Test Suite & Security Detonation Benchmark
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx

    - name: Run Full Test Suite
      env:
        PYTHONPATH: ${{ github.workspace }}/backend
      run: |
        echo "=== Running SupplyShield Full Test Suite ==="
        python -m pytest backend/ -v -p no:capture
        python backend/run_tests.py

    - name: Run Real Benchmark Evaluation Pipeline
      env:
        PYTHONPATH: ${{ github.workspace }}/backend
        SUPPLYSHIELD_ALLOW_WEAK_SANDBOX: "true"
      run: |
        echo "=== Generating Benchmark Dataset & Evaluating ==="
        python benchmarks/build_dataset.py
        python benchmarks/evaluate.py

    - name: Verify CLI Security Scans
      env:
        PYTHONPATH: ${{ github.workspace }}/backend
      run: |
        echo "=== Verifying CLI Scans ==="
        # Safe package must exit 0
        python backend/cli.py scan backend/samples/safe_math_pkg.py --fail-on CRITICAL
        # Malicious package must detect threats and exit 1 when --fail-on CRITICAL is specified
        python backend/cli.py scan backend/samples/reverse_shell.py --fail-on CRITICAL || echo "Correctly blocked malicious package (exit code 1)"

    - name: Upload Security Reports & Benchmark Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: supplyshield-audit-benchmark-artifacts
        path: |
          benchmarks/RESULTS.md
          backend/supplyshield_audit.db
