name: SupplyShield Security Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  supply-chain-security-audit:
    name: SupplyShield AST & Detonation Audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run SupplyShield Security CLI Scan on Package Samples
      run: |
        python backend/cli.py scan backend/samples/safe_math_pkg.py --fail-on CRITICAL
        python backend/cli.py scan backend/samples/reverse_shell.py --format json --output report.json || true

    - name: Upload Security Audit Artifacts
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: supplyshield-security-report
        path: report.json
